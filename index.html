<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trail</title>
<style>
  :root {
    --bg: #EFEBE2;
    --card: #FCFAF5;
    --ink: #2B2620;
    --ink-soft: #7A7164;
    --line: #DDD5C6;
    --rule: #A99C87;
    --red: #A8232E;
    --red-soft: #F3E0DD;
    --navy: #24405E;
    --navy-soft: #E2E8EF;
    --lattice: rgba(36, 64, 94, .32);
    --ok: #24405E;
    --warn: #966A22;
    --done: #ACA394;
    --gold: #B98A2E;
    --chip-red: #A8232E;   --chip-red-bg: #F3E0DD;
    --chip-amber: #83591C; --chip-amber-bg: #EFE3CA;
    --chip-blue: #24405E;  --chip-blue-bg: #E2E8EF;
    --chip-gray: #6E6459;  --chip-gray-bg: #E8E2D5;
    --display: "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
    --body-face: "Avenir Next", "Avenir", "Seravek", "Segoe UI", sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", monospace;
    --chevron: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2210%22%20height%3D%226%22%3E%3Cpath%20d%3D%22M1%201l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%237A7164%22%20stroke-width%3D%221.5%22/%3E%3C/svg%3E");
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171410;
      --card: #211D17;
      --ink: #EAE2D2;
      --ink-soft: #9C9182;
      --line: #363028;
      --rule: #5C5342;
      --red: #E2737C;
      --red-soft: #3A2323;
      --navy: #92AECE;
      --navy-soft: #212B36;
      --lattice: rgba(146, 174, 206, .24);
      --ok: #92AECE;
      --warn: #CDA05C;
      --done: #6B6353;
      --gold: #CDA05C;
      --chip-red: #E2737C;   --chip-red-bg: #3A2323;
      --chip-amber: #D3AC77; --chip-amber-bg: #342A18;
      --chip-blue: #A5C0DE;  --chip-blue-bg: #212B36;
      --chip-gray: #ABA08D;  --chip-gray-bg: #2B261E;
      --chevron: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2210%22%20height%3D%226%22%3E%3Cpath%20d%3D%22M1%201l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%239C9182%22%20stroke-width%3D%221.5%22/%3E%3C/svg%3E");
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 500 15px/1.55 var(--body-face);
    padding: 48px 20px 120px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  header { text-align: center; }
  header h1 {
    font-family: var(--display);
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .16em;
    line-height: 1.15;
  }
  .lattice {
    height: 40px; margin-top: 16px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    background-image:
      repeating-linear-gradient(63deg, var(--lattice) 0 1px, transparent 1px 15px),
      repeating-linear-gradient(-63deg, var(--lattice) 0 1px, transparent 1px 15px);
  }
  .sub {
    color: var(--ink-soft); font-size: 14px; font-weight: 500;
    text-transform: lowercase; margin-top: 14px;
  }

  .toolbar {
    margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    border-radius: 99px; padding: 6px 14px;
    font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: lowercase;
    cursor: pointer;
  }
  .pill:hover { border-color: var(--red); color: var(--red); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .pill.ok .dot { background: var(--ok); }
  .pill.warn .dot { background: var(--warn); }
  .pill.static { cursor: default; }
  .pill.static:hover { border-color: var(--line); color: var(--ink-soft); }

  .progress { margin-top: 26px; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress > div {
    height: 100%; width: 0%;
    background: var(--red); border-radius: 99px;
    transition: width .45s cubic-bezier(.22,1,.36,1);
  }
  .progress.pulse > div { animation: barpulse .55s ease; }
  @keyframes barpulse {
    0% { filter: brightness(1.7); }
    100% { filter: brightness(1); }
  }
  .progress-label {
    font: 500 11px var(--mono); letter-spacing: .12em; text-transform: lowercase;
    color: var(--ink-soft); margin-top: 10px;
  }

  .adder { margin-top: 24px; display: flex; gap: 9px; flex-wrap: wrap; }
  .adder input[type=text] {
    flex: 1 1 220px; background: var(--card); color: var(--ink); text-align: left;
    border: 1px solid var(--line); border-radius: 99px;
    padding: 9px 16px; font: 500 14px/1.4 var(--body-face); outline: none;
  }
  .adder input[type=text]::placeholder { color: var(--ink-soft); }
  .adder input[type=text]:focus { border-color: var(--red); }
  .adder select {
    appearance: none; -webkit-appearance: none;
    background: var(--card) var(--chevron) no-repeat right 13px center;
    background-size: 10px 6px;
    color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 99px; padding: 9px 32px 9px 15px;
    font: 500 11px var(--mono); letter-spacing: .06em; text-transform: lowercase;
    outline: none; cursor: pointer;
  }
  .adder select:hover, .adder select:focus { border-color: var(--red); color: var(--ink); }
  .adder button {
    background: var(--red); color: var(--card); border: 1px solid var(--red);
    border-radius: 99px; padding: 9px 22px;
    font: 700 13.5px var(--body-face); text-transform: lowercase;
    cursor: pointer;
  }
  .adder button:hover { filter: brightness(1.08); }

  .section { margin-top: 38px; }
  .section > h2 {
    display: flex; align-items: center; gap: 12px;
    font: 500 11px var(--mono); letter-spacing: .2em; text-transform: lowercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .section > h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .section > h2 .count { color: var(--red); font-weight: 700; letter-spacing: .04em; }
  .section.empty-hidden { display: none; }

  /* the ledger margin rule: inside the line a section opens; leave it and everything closes */
  #sections { position: relative; }
  .tasks-clip { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s ease .08s, opacity .35s ease .08s; }
  .tasks-clip > ul { min-height: 0; overflow: hidden; }
  @media (hover: hover) {
    #sections { padding-left: 30px; }
    #sections::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 2px;
      border-left: 1px solid color-mix(in srgb, var(--red) 55%, transparent);
    }
    #sections .section { margin-left: -30px; padding-left: 30px; }
    .tasks-clip { grid-template-rows: 0fr; opacity: .25; }
    .section:hover .tasks-clip,
    .section.live .tasks-clip,
    .section:has(.cutform, .splitform) .tasks-clip,
    .section:has(:focus-visible) .tasks-clip { grid-template-rows: 1fr; opacity: 1; }
    .section:hover > h2, .section.live > h2 { color: var(--ink); }
  }

  ul.tasks { list-style: none; }
  li.task {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 9px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 13px;
    padding: 14px 17px;
    align-items: start;
    position: relative;
    overflow: hidden;
    max-height: 400px;
    transition: opacity .8s ease, filter .8s ease, transform .8s ease,
                max-height .55s ease .45s, margin-bottom .55s ease .45s,
                padding .55s ease .45s, border-width .55s ease .45s;
  }
  li.task:hover { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
  li.task.newborn { animation: newborn .45s cubic-bezier(.2, 1.2, .4, 1); }
  @keyframes newborn {
    from { opacity: 0; transform: translateY(-7px) scale(.97); }
  }

  /* drag a card onto another section to move it */
  li.task.dragging { opacity: .45; }
  body.dragging-now .section.empty-hidden { display: block; }
  .section.dropzone > h2 { color: var(--red); }
  .section.dropzone > h2::after { border-top-color: var(--red); }

  /* a paper-form tick box */
  .box {
    appearance: none; -webkit-appearance: none;
    width: 21px; height: 21px; margin-top: 1px;
    border: 1.5px solid var(--rule);
    border-radius: 5px; cursor: pointer; position: relative;
    background: transparent; flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .box:hover { border-color: var(--red); }
  .box:checked { background: var(--red); border-color: var(--red); animation: pop .3s cubic-bezier(.3, 1.6, .4, 1); }
  .box:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 5px; height: 10px;
    border: solid var(--card); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  @keyframes pop {
    0% { transform: scale(.75); }
    60% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  .task .body { min-width: 0; }
  .task .title {
    font-weight: 600; font-size: 15px;
    display: inline;
    cursor: pointer;
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-size: 0% 2px;
    background-position: 0 58%;
    transition: background-size .5s ease, color .4s ease;
  }
  li.task:not(.checked) .title:hover {
    text-decoration: underline dotted var(--ink-soft);
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }
  .task .detail { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 10px var(--mono); letter-spacing: .06em; text-transform: lowercase;
    padding: 3px 10px; border-radius: 99px;
  }
  .chip.red   { color: var(--chip-red);   background: var(--chip-red-bg); }
  .chip.amber { color: var(--chip-amber); background: var(--chip-amber-bg); }
  .chip.blue  { color: var(--chip-blue);  background: var(--chip-blue-bg); }
  .chip.gray  { color: var(--chip-gray);  background: var(--chip-gray-bg); }
  .chip.tag   { color: var(--ink-soft); background: transparent; border: 1px solid var(--line); }

  .cutbtn {
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 7px; border-radius: 99px;
    opacity: 0; transition: opacity .15s ease, color .15s, background .15s;
  }
  li.task:hover .cutbtn { opacity: .7; }
  .cutbtn:hover { opacity: 1 !important; color: var(--navy); background: var(--navy-soft); }
  @media (hover: none) { .cutbtn { opacity: .5; } }

  .cutform, .splitform { grid-column: 1 / -1; margin-top: 4px; }
  .cutform textarea {
    width: 100%; min-height: 64px; resize: vertical;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font: 500 13.5px/1.45 var(--body-face); outline: none;
  }
  .cutform textarea:focus { border-color: var(--navy); }
  .splitform input {
    width: 100%; margin-bottom: 7px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 14px; font: 500 13.5px/1.4 var(--body-face); outline: none;
  }
  .splitform input:focus { border-color: var(--red); }
  .cutform .row, .splitform .row { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .cutform button, .splitform button {
    border-radius: 99px; padding: 7px 16px;
    font: 700 12.5px var(--body-face); text-transform: lowercase;
    cursor: pointer;
  }
  .cutform .confirm { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
  .cutform .confirm:hover { background: var(--navy); color: var(--card); }
  .splitform .confirm { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .splitform .confirm:hover { background: var(--red); color: var(--card); }
  .cutform .cancel, .splitform .cancel { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .cutform .hint, .splitform .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  li.task.checked .title { background-size: 100% 2px; color: var(--done); }
  li.task.checked .detail, li.task.checked .chip { opacity: .45; }

  /* every action goes on the record */
  li.task.checked::after {
    content: "recorded";
    position: absolute; right: 46px; top: 50%;
    font: 500 10px var(--mono); letter-spacing: .18em; text-transform: lowercase;
    color: var(--red); border: 1.5px solid currentColor; border-radius: 99px;
    padding: 3px 9px 3px 12px; background: var(--card);
    opacity: 0; pointer-events: none;
    transform: translateY(-50%) rotate(-6deg);
    animation: stamp .35s cubic-bezier(.2, 1.2, .4, 1) .2s forwards;
  }
  li.task.melting.cut::after { content: "cut"; color: var(--navy); }
  @keyframes stamp {
    0%   { opacity: 0;   transform: translateY(-50%) rotate(-6deg) scale(1.7); }
    100% { opacity: .95; transform: translateY(-50%) rotate(-6deg) scale(1); }
  }

  /* the completion burst — a little more than the click deserves */
  .burst { position: fixed; z-index: 99; pointer-events: none; }
  .burst i {
    position: absolute; left: -2px; top: -2px;
    width: 5px; height: 5px; border-radius: 1.5px;
    animation: fling var(--dur) cubic-bezier(.15, .8, .3, 1) forwards;
  }
  @keyframes fling {
    from { transform: translate(0, 0) rotate(0); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  /* paper slides off the desk */
  li.task.melting {
    opacity: 0;
    transform: translate(26px, -6px) rotate(1.5deg);
    transform-origin: center;
    max-height: 0; margin-bottom: 0;
    padding-top: 0; padding-bottom: 0;
    border-width: 0; pointer-events: none;
  }
  li.task.melting.cut { filter: grayscale(1); transform: translate(26px, 8px) rotate(-2deg); }

  .drawer { margin-top: 46px; border-top: 1px solid var(--line); padding-top: 16px; }
  .drawer summary {
    cursor: pointer; color: var(--ink-soft);
    font: 500 11px var(--mono); letter-spacing: .14em; text-transform: lowercase;
    list-style: none; user-select: none;
  }
  .drawer summary:hover { color: var(--red); }
  .drawer summary::-webkit-details-marker { display: none; }
  .drawer summary::before { content: "▸ "; }
  .drawer[open] summary::before { content: "▾ "; }
  ul.log-list { list-style: none; margin-top: 10px; }
  ul.log-list li {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 7px 4px; color: var(--done); font-size: 14px;
  }
  ul.log-list li .t { text-decoration: line-through; }
  ul.log-list li .note { font-style: italic; font-size: 13px; flex-basis: 100%; padding-left: 18px; }
  ul.log-list li .when { font: 400 10.5px var(--mono); letter-spacing: .06em; }
  ul.log-list button {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 99px; padding: 3px 12px;
    font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: lowercase;
    cursor: pointer;
  }
  ul.log-list button:hover { color: var(--red); border-color: var(--red); }

  .all-clear { display: none; text-align: center; margin-top: 60px; color: var(--ink-soft); }
  .all-clear .lattice { margin: 0 0 26px; }
  .all-clear .big {
    font-family: var(--display); font-size: 25px; color: var(--ink);
    text-transform: uppercase; letter-spacing: .18em;
  }
  .all-clear p { margin-top: 10px; font-size: 14.5px; }

  .footer-note {
    margin-top: 54px; text-align: center;
    font: 500 10px var(--mono); letter-spacing: .14em; text-transform: lowercase;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition-duration: .01ms !important; transition-delay: 0ms !important;
      animation-duration: .01ms !important; animation-delay: 0ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="app-title">Paper Trail</h1>
    <div class="lattice"></div>
    <div class="sub" id="app-subtitle"></div>
    <div class="toolbar">
      <button class="pill" id="ledger-pill" title="Ledger file sync"><span class="dot"></span><span id="ledger-label">Ledger: not connected</span></button>
      <button class="pill" id="export-btn" title="Build a print-ready delivery summary — save as PDF from the print dialog">Export report</button>
      <button class="pill" id="import-btn">Import ledger</button>
      <input type="file" id="import-input" accept="application/json" hidden>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-label" id="bar-label"></div>
    <div class="adder">
      <input type="text" id="add-input" placeholder="Add to the record…">
      <select id="add-section"></select>
      <button id="add-btn">Add</button>
    </div>
  </header>

  <div id="sections"></div>

  <div class="all-clear" id="all-clear">
    <div class="lattice"></div>
    <div class="big">Nothing outstanding</div>
    <p>Every item is on the record.</p>
  </div>

  <details class="drawer" id="done-drawer" style="display:none">
    <summary id="done-summary"></summary>
    <ul class="log-list" id="done-list"></ul>
  </details>

  <details class="drawer" id="cut-drawer" style="display:none">
    <summary id="cut-summary"></summary>
    <ul class="log-list" id="cut-list"></ul>
  </details>

  <div class="footer-note">paper trail · every check-off and cut is timestamped in the ledger</div>
</div>

<script>
/* ---------- data loading: data/tasks.js (private) with sample fallback ---------- */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

(async function boot() {
  try { await loadScript("data/tasks.js"); }
  catch { await loadScript("sample-data/tasks.sample.js"); }
  if (!window.PAPERTRAIL) {
    document.getElementById("app-subtitle").textContent =
      "No task data found. Copy sample-data/tasks.sample.js to data/tasks.js and edit it.";
    return;
  }
  init(window.PAPERTRAIL);
})();

function init(DATA) {
  const NS = "papertrail::" + (DATA.storageKey || "default") + "::";
  const OLD_NS = "meltaway::" + (DATA.storageKey || "default") + "::";  // pre-rename state
  const SECTIONS = DATA.sections;
  const DEFAULT_TASKS = DATA.tasks;

  document.title = DATA.title || "Paper Trail";
  document.getElementById("app-title").textContent = DATA.title || "Paper Trail";
  document.getElementById("app-subtitle").textContent = DATA.subtitle || "";

  /* ---------- persistence ---------- */
  const load = (k, fb) => { try { return JSON.parse(localStorage.getItem(NS + k) ?? localStorage.getItem(OLD_NS + k)) ?? fb; } catch { return fb; } };
  const save = (k, v) => localStorage.setItem(NS + k, JSON.stringify(v));

  let done = new Set(load("done", []));
  let cut = load("cut", {});            // id -> {note, ts}
  let split = load("split", {});        // id -> {ts, into: [id, id]}
  let moved = load("moved", {});        // id -> section id, for drag-and-drop moves
  let custom = load("custom", []);
  let ledger = load("ledger", []);      // append-only event log
  let unsynced = load("unsynced", 0);

  /* one-time migration from the pre-repo Desktop version */
  if (DATA.migrateFrom && done.size === 0 && ledger.length === 0) {
    try {
      const oldDone = JSON.parse(localStorage.getItem(DATA.migrateFrom.done) || "[]");
      const oldCustom = JSON.parse(localStorage.getItem(DATA.migrateFrom.custom) || "[]");
      if (oldDone.length || oldCustom.length) {
        done = new Set(oldDone);
        custom = oldCustom.map(t => ({ id: t.id, s: t.s, t: t.t, d: t.d, chips: t.chips }));
        for (const t of custom) ledger.push({ ts: null, type: "added", id: t.id, title: t.t, section: t.s, note: "migrated from v1" });
        for (const id of oldDone) {
          const t = DEFAULT_TASKS.concat(custom).find(x => x.id === id);
          ledger.push({ ts: null, type: "done", id, title: t ? t.t : id, section: t ? t.s : null, note: "migrated from v1 (timestamp unknown)" });
        }
        persist();
      }
    } catch {}
  }

  function persist() {
    save("done", [...done]); save("cut", cut); save("split", split); save("moved", moved); save("custom", custom);
    save("ledger", ledger); save("unsynced", unsynced);
  }

  const allTasks = () => DEFAULT_TASKS.concat(custom).map(t => moved[t.id] ? { ...t, s: moved[t.id] } : t);
  const findTask = id => allTasks().find(t => t.id === id);
  const secName = id => (SECTIONS.find(s => s.id === id) || {}).name || id;

  /* ---------- ledger events ---------- */
  function logEvent(type, id, note) {
    const t = findTask(id) || {};
    ledger.push({
      ts: new Date().toISOString(),
      type, id,
      title: t.t || id,
      section: t.s || null,
      sectionName: t.s ? secName(t.s) : null,
      re: t.re || null,
      note: note || null,
    });
    unsynced++;
    persist();
    syncFile();
    renderLedgerPill();
  }

  function ledgerObj() {
    return {
      app: "papertrail",
      version: 1,
      title: DATA.title || "Paper Trail",
      exportedAt: new Date().toISOString(),
      state: {
        open: allTasks().filter(t => !done.has(t.id) && !cut[t.id] && !split[t.id]).map(t => ({ id: t.id, title: t.t, section: secName(t.s), re: t.re || null })),
        done: [...done].map(id => { const t = findTask(id) || {}; return { id, title: t.t || id, re: t.re || null }; }),
        cut: Object.entries(cut).map(([id, v]) => { const t = findTask(id) || {}; return { id, title: t.t || id, re: t.re || null, note: v.note, ts: v.ts }; }),
      },
      events: ledger,
    };
  }

  /* ---------- ledger file sync (File System Access API, Chrome/Edge) ---------- */
  const FS_OK = "showSaveFilePicker" in window;
  let fsHandle = null;
  let fsGranted = false;

  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("papertrail-fs", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("handles");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("handles").objectStore("handles").get(key);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("handles", "readwrite").objectStore("handles").put(val, key);
        q.onsuccess = () => res(); q.onerror = () => rej(q.error);
      });
    },
  };

  async function syncFile() {
    if (!fsHandle || !fsGranted) return;
    try {
      const w = await fsHandle.createWritable();
      await w.write(JSON.stringify(ledgerObj(), null, 2));
      await w.close();
      unsynced = 0; persist(); renderLedgerPill();
    } catch { fsGranted = false; renderLedgerPill(); }
  }

  async function connectLedgerFile() {
    if (!FS_OK) { exportLedger(); return; }
    try {
      if (fsHandle && !fsGranted) {
        const p = await fsHandle.requestPermission({ mode: "readwrite" });
        if (p === "granted") { fsGranted = true; await syncFile(); return; }
      }
      fsHandle = await window.showSaveFilePicker({
        suggestedName: "ledger.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      await idb.set("ledger", fsHandle);
      fsGranted = true;
      await syncFile();
    } catch { /* user cancelled */ }
    renderLedgerPill();
  }

  async function restoreHandle() {
    if (!FS_OK) return;
    try {
      const h = await idb.get("ledger");
      if (!h) return;
      fsHandle = h;
      const p = await h.queryPermission({ mode: "readwrite" });
      fsGranted = (p === "granted");
      if (fsGranted && unsynced > 0) await syncFile();
    } catch {}
    renderLedgerPill();
  }

  function exportLedger() {
    const blob = new Blob([JSON.stringify(ledgerObj(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ledger.json";
    a.click();
    URL.revokeObjectURL(a.href);
    unsynced = 0; persist(); renderLedgerPill();
  }

  /* ---------- close-out report: the ledger compiled for the founders ---------- */
  function exportReport() {
    const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const day = ts => ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";

    const doneAt = {};
    for (const e of ledger) if (e.type === "done" && e.ts) doneAt[e.id] = e.ts;
    const tasks = allTasks().filter(t => !split[t.id]);
    const delivered = tasks.filter(t => done.has(t.id));
    const cuts = tasks.filter(t => cut[t.id]);
    const open = tasks.filter(t => !done.has(t.id) && !cut[t.id]);
    const addedScope = ledger.filter(e => e.type === "added" && !/from split|migrated/.test(e.note || ""));
    const firstTs = (ledger.find(e => e.ts) || {}).ts;
    const pct = tasks.length ? Math.round((delivered.length + cuts.length) / tasks.length * 100) : 0;
    const today = new Date().toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

    const areas = {};
    for (const t of tasks) (areas[t.re || "General"] = areas[t.re || "General"] || []).push(t);
    const areaNames = Object.keys(areas).sort();

    const line = (glyph, cls, text, extra) =>
      `<div class="li ${cls}"><span class="g">${glyph}</span>${esc(text)}${extra || ""}</div>`;

    const areaBlocks = areaNames.map(name => {
      const d = areas[name].filter(t => done.has(t.id));
      const c = areas[name].filter(t => cut[t.id]);
      const o = areas[name].filter(t => !done.has(t.id) && !cut[t.id]);
      return `<div class="area">
        <h3>${esc(name)} <span class="tally">${d.length}/${areas[name].length} delivered</span></h3>
        ${d.map(t => line("✓", "d", t.t, ` <span class="when">${day(doneAt[t.id])}</span>`)).join("")}
        ${c.map(t => line("—", "c", t.t, ` <span class="why">descoped: ${esc(cut[t.id].note)}</span>`)).join("")}
        ${o.map(t => line("○", "o", t.t)).join("")}
      </div>`;
    }).join("");

    const addedBlock = addedScope.map(e => {
      const t = findTask(e.id);
      const st = done.has(e.id) ? ["✓", "d"] : cut[e.id] ? ["—", "c"] : ["○", "o"];
      return line(st[0], st[1], t ? t.t : e.title, ` <span class="when">added ${day(e.ts)}</span>`);
    }).join("");

    const html = `<!doctype html><html><head><meta charset="utf-8">
<title>${esc(DATA.title)} — close-out report</title>
<style>
  @page { size: letter; margin: 15mm 16mm; }

  body { font: 10pt/1.5 "Avenir Next", Avenir, Helvetica, Arial, sans-serif; color: #23272E;
         max-width: 760px; margin: 0 auto; padding: 36px 24px; background: #fff; }
  .top { display: flex; justify-content: space-between; border-bottom: 2.5px solid #1F3A5F;
         padding-bottom: 7px; font-size: 7.5pt; font-weight: 600; letter-spacing: .18em;
         text-transform: uppercase; color: #1F3A5F; }
  h1 { font-size: 19pt; font-weight: 700; letter-spacing: -.01em; color: #1F3A5F; margin: 16px 0 3px; }
  .meta { font-size: 9pt; color: #5C6470; }
  .kpis { display: flex; gap: 30px; margin: 16px 0 2px; }
  .kpi .n { font-size: 21pt; font-weight: 700; line-height: 1.15; color: #1F3A5F; }
  .kpi.red .n { color: #A8232E; }
  .kpi .l { font-size: 7.5pt; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: #5C6470; }
  h2 { font-size: 9.5pt; text-transform: uppercase; letter-spacing: .14em; color: #1F3A5F;
       border-bottom: 1px solid #C9CED6; padding-bottom: 4px; margin: 18px 0 8px; }
  ul.exec { margin: 0 0 4px 16px; }
  ul.exec li { margin-bottom: 3px; }
  .area { break-inside: avoid; margin-bottom: 11px; }
  .area h3 { font-size: 10pt; font-weight: 700; margin-bottom: 3px; }
  .area .tally { font-size: 8.5pt; font-weight: 500; color: #5C6470; }
  .li { padding-left: 16px; text-indent: -16px; margin-bottom: 1.5px; }
  .li .g { display: inline-block; width: 16px; text-indent: 0; }
  .li.d .g { color: #1F3A5F; font-weight: 700; }
  .li.c { color: #5C6470; }
  .li.c .g { color: #A8232E; }
  .li.o .g { color: #97A0AC; }
  .when { color: #97A0AC; font-size: 8.5pt; }
  .why { color: #5C6470; font-style: italic; }
  .foot { display: flex; justify-content: space-between; margin-top: 22px;
          border-top: 1px solid #C9CED6; padding-top: 6px; font-size: 8pt; color: #5C6470; }
  .printbtn { position: fixed; right: 18px; top: 14px; background: #1F3A5F; color: #fff; border: 0;
              border-radius: 4px; padding: 9px 16px; font: 600 10pt "Avenir Next", Avenir, sans-serif; cursor: pointer; }
  @media print { .printbtn { display: none; } body { padding: 0; } }
</style></head><body>
  <div class="top"><span>Engagement close-out · prepared for the founders</span><span>${esc(today)}</span></div>
  <h1>Delivery summary &amp; handoff record</h1>
  <div class="meta">${esc(DATA.title)}${firstTs ? ` · period ${day(firstTs)} – ${day(new Date().toISOString())}` : ""} · compiled from the append-only task ledger (${ledger.length} recorded events)</div>

  <div class="kpis">
    <div class="kpi"><div class="n">${delivered.length}</div><div class="l">Delivered</div></div>
    <div class="kpi"><div class="n">${pct}%</div><div class="l">Plan resolved</div></div>
    <div class="kpi red"><div class="n">${addedScope.length}</div><div class="l">Added scope</div></div>
    <div class="kpi"><div class="n">${cuts.length}</div><div class="l">Conscious cuts</div></div>
  </div>

  <h2>Executive summary</h2>
  <ul class="exec">
    <li><b>${delivered.length} of ${tasks.length}</b> scoped items delivered across <b>${areaNames.length} work areas</b>, mapped to the role's stated expectations below.</li>
    <li><b>${addedScope.length} items of scope absorbed beyond the original plan</b> — work taken on that was never scoped.</li>
    <li><b>${cuts.length} items consciously descoped</b>, each with its rationale on the record — deliberate tradeoffs, not misses.</li>
    <li><b>${open.length} items remain open</b> and are flagged (○) below as the handoff list.</li>
  </ul>

  <h2>Delivery by work area</h2>
  ${areaBlocks}

  ${addedScope.length ? `<h2>Added scope — beyond the original plan</h2>${addedBlock}` : ""}

  <div class="foot"><span>Confidential — internal</span><span>Generated ${esc(today)} from ledger evidence · paper trail</span></div>

    const w = window.open("", "_blank");
    if (!w) { alert("Allow pop-ups for this page to export the report."); return; }
    w.document.write(html);
    w.document.close();
  }

  function importLedger(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.events)) throw new Error("no events");
        if (!confirm("Import replaces the current board state with the ledger's history. Continue?")) return;
        done = new Set(); cut = {}; split = {}; moved = {}; custom = []; ledger = data.events;
        for (const e of ledger) {
          if (e.type === "added" && !DEFAULT_TASKS.some(t => t.id === e.id) && !custom.some(t => t.id === e.id)) {
            custom.push({ id: e.id, s: e.section || SECTIONS[0].id, t: e.title, chips: [["gray", "added by me"]] });
          }
          if (e.type === "done") { done.add(e.id); delete cut[e.id]; }
          if (e.type === "cut") { cut[e.id] = { note: e.note, ts: e.ts }; done.delete(e.id); }
          if (e.type === "split") { split[e.id] = { ts: e.ts }; }
          if (e.type === "moved" && e.section) { moved[e.id] = e.section; }
          if (e.type === "restored") { done.delete(e.id); delete cut[e.id]; }
        }
        unsynced = 0; persist(); render();
      } catch { alert("That file doesn't look like a Paper Trail ledger."); }
    };
    r.readAsText(file);
  }

  /* ---------- completion feedback ---------- */
  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* progress must move the moment the box is ticked, not after the card leaves */
  function previewProgress(pendingDone) {
    const total = allTasks().filter(t => !split[t.id]).length;
    const d = allTasks().filter(t => done.has(t.id)).length + pendingDone;
    const c = allTasks().filter(t => cut[t.id]).length;
    const pct = total ? Math.round(((d + c) / total) * 100) : 0;
    const bar = document.getElementById("bar");
    bar.style.width = pct + "%";
    document.getElementById("bar-label").textContent =
      `${total - d - c} open · ${d} done · ${c} cut · ${pct}%`;
    const track = bar.parentElement;
    track.classList.remove("pulse"); void track.offsetWidth;
    track.classList.add("pulse");
  }

  function celebrate(el) {
    if (REDUCED_MOTION) return;
    const r = el.getBoundingClientRect();
    const burst = document.createElement("div");
    burst.className = "burst";
    burst.style.left = (r.left + r.width / 2) + "px";
    burst.style.top = (r.top + r.height / 2) + "px";
    const jackpot = Math.random() < 0.15;   // variable-ratio schedule: occasional bigger payoff
    const n = jackpot ? 16 : 7 + Math.floor(Math.random() * 4);
    const colors = ["var(--red)", "var(--navy)", "var(--gold)"];
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i");
      const ang = Math.random() * 2 * Math.PI;
      const dist = (jackpot ? 46 : 30) + Math.random() * 26;
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", (Math.sin(ang) * dist - 14) + "px");
      p.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
      p.style.setProperty("--dur", (0.5 + Math.random() * 0.35) + "s");
      p.style.background = colors[i % 3];
      burst.appendChild(p);
    }
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 1000);
  }

  /* ---------- rendering ---------- */
  const $sections = document.getElementById("sections");

  /* re-renders replace the DOM and the browser won't re-evaluate :hover until the
     mouse moves — so track the hovered section and re-pin it across renders */
  let hoverSec = null;
  function pinHover() {
    for (const el of $sections.children) el.classList.toggle("live", el.dataset.sec === hoverSec);
  }
  $sections.addEventListener("pointerover", e => {
    const s = e.target.closest(".section");
    const id = s ? s.dataset.sec : null;
    if (id !== hoverSec) { hoverSec = id; pinHover(); }
  });
  $sections.addEventListener("pointerleave", () => { hoverSec = null; pinHover(); });

  function chipsHtml(t) {
    const chips = (t.chips || []).map(([c, txt]) => `<span class="chip ${c}">${txt}</span>`);
    if (t.re) chips.push(`<span class="chip tag">${t.re}</span>`);
    return chips.length ? `<div class="chips">${chips.join("")}</div>` : "";
  }

  function taskEl(t) {
    const li = document.createElement("li");
    li.className = "task";
    li.dataset.id = t.id;
    li.innerHTML = `
      <input type="checkbox" class="box" aria-label="complete task">
      <div class="body">
        <span class="title">${t.t}</span>
        ${t.d ? `<div class="detail">${t.d}</div>` : ""}
        ${chipsHtml(t)}
      </div>
      <button class="cutbtn" title="Remove from list (with a note)">✕</button>`;

    li.draggable = true;
    li.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", t.id);
      e.dataTransfer.effectAllowed = "move";
      li.classList.add("dragging");
      document.body.classList.add("dragging-now");
    });
    li.addEventListener("dragend", () => {
      li.classList.remove("dragging");
      document.body.classList.remove("dragging-now");
      for (const s of $sections.children) s.classList.remove("dropzone");
    });

    li.querySelector(".box").addEventListener("change", (e) => {
      if (!e.target.checked) return;
      li.classList.add("checked");
      celebrate(e.target);
      previewProgress(1);
      setTimeout(() => li.classList.add("melting"), 650);
      setTimeout(() => { done.add(t.id); logEvent("done", t.id); render(); }, 1750);
    });

    const titleEl = li.querySelector(".title");
    titleEl.title = "Click to split into two to-dos";
    titleEl.addEventListener("click", () => {
      if (li.classList.contains("checked")) return;
      if (li.querySelector(".splitform") || li.querySelector(".cutform")) return;
      const form = document.createElement("div");
      form.className = "splitform";
      form.innerHTML = `
        <input type="text" class="half">
        <input type="text" class="half" placeholder="…and the second to-do">
        <div class="hint">Splits this into two to-dos — the split itself goes in the ledger.</div>
        <div class="row">
          <button class="cancel">Cancel</button>
          <button class="confirm">Split in two</button>
        </div>`;
      const [h1, h2] = form.querySelectorAll(".half");
      h1.value = t.t;
      li.appendChild(form);
      h2.focus();
      form.querySelector(".cancel").onclick = () => form.remove();
      form.querySelector(".confirm").onclick = () => {
        const a = h1.value.trim(), b = h2.value.trim();
        if (!a || !b) { (!a ? h1 : h2).placeholder = "Both halves need a title."; (!a ? h1 : h2).focus(); return; }
        const base = "c-" + Date.now();
        const mk = (sfx, txt) => ({ id: base + sfx, s: t.s, t: txt, d: t.d, chips: t.chips, re: t.re });
        const ta = mk("-a", a), tb = mk("-b", b);
        custom.push(ta, tb);
        split[t.id] = { ts: new Date().toISOString(), into: [ta.id, tb.id] };
        logEvent("split", t.id, `→ “${a}” + “${b}”`);
        logEvent("added", ta.id, "from split");
        logEvent("added", tb.id, "from split");
        render();
        for (const id of [ta.id, tb.id]) {
          const el = $sections.querySelector(`li[data-id="${id}"]`);
          if (el) el.classList.add("newborn");
        }
      };
    });

    li.querySelector(".cutbtn").addEventListener("click", () => {
      if (li.querySelector(".cutform")) return;
      const form = document.createElement("div");
      form.className = "cutform";
      form.innerHTML = `
        <textarea placeholder="Note for the record — why is this coming off the list? (e.g. traded against X, no longer relevant, handed off)"></textarea>
        <div class="hint">This goes in the ledger — and your end-of-project summary — as a conscious cut, not a miss.</div>
        <div class="row">
          <button class="cancel">Cancel</button>
          <button class="confirm">Remove from list</button>
        </div>`;
      li.appendChild(form);
      const ta = form.querySelector("textarea");
      ta.focus();
      form.querySelector(".cancel").onclick = () => form.remove();
      form.querySelector(".confirm").onclick = () => {
        const note = ta.value.trim();
        if (!note) { ta.placeholder = "A note is required — future-you will want the why."; ta.focus(); return; }
        li.classList.add("checked");
        setTimeout(() => li.classList.add("melting", "cut"), 250);
        setTimeout(() => {
          cut[t.id] = { note, ts: new Date().toISOString() };
          logEvent("cut", t.id, note);
          render();
        }, 1350);
      };
    });
    return li;
  }

  function render() {
    $sections.innerHTML = "";
    for (const sec of SECTIONS) {
      const items = allTasks().filter(t => t.s === sec.id && !done.has(t.id) && !cut[t.id] && !split[t.id]);
      const el = document.createElement("div");
      el.className = "section";
      el.dataset.sec = sec.id;
      if (sec.id === hoverSec) el.classList.add("live");
      el.innerHTML = `<h2>${sec.name} <span class="count">· ${items.length}</span></h2>`;
      el.addEventListener("dragover", e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (hoverSec !== sec.id) { hoverSec = sec.id; pinHover(); }
        el.classList.add("dropzone");
      });
      el.addEventListener("dragleave", () => el.classList.remove("dropzone"));
      el.addEventListener("drop", e => {
        e.preventDefault();
        moveTask(e.dataTransfer.getData("text/plain"), sec.id);
      });
      const clip = document.createElement("div");
      clip.className = "tasks-clip";
      const ul = document.createElement("ul");
      ul.className = "tasks";
      for (const t of items) ul.appendChild(taskEl(t));
      clip.appendChild(ul);
      el.appendChild(clip);
      if (items.length === 0) el.classList.add("empty-hidden");
      $sections.appendChild(el);
    }
    renderDrawers();
    renderProgress();
    renderLedgerPill();
  }

  function moveTask(id, secId) {
    const t = findTask(id);
    if (!t || t.s === secId) return;
    moved[id] = secId;
    logEvent("moved", id, "→ " + secName(secId));
    render();
    const el = $sections.querySelector(`li[data-id="${id}"]`);
    if (el) el.classList.add("newborn");
  }

  function fmtWhen(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function renderDrawers() {
    const doneTasks = allTasks().filter(t => done.has(t.id));
    const dd = document.getElementById("done-drawer");
    dd.style.display = doneTasks.length ? "" : "none";
    document.getElementById("done-summary").textContent = `Done (${doneTasks.length}) — click to review or restore`;
    const dl = document.getElementById("done-list");
    dl.innerHTML = "";
    for (const t of doneTasks) {
      const ev = [...ledger].reverse().find(e => e.id === t.id && e.type === "done");
      const li = document.createElement("li");
      li.innerHTML = `<span class="t">✓ ${t.t}</span><span class="when">${ev ? fmtWhen(ev.ts) : ""}</span><button>restore</button>`;
      li.querySelector("button").onclick = () => { done.delete(t.id); logEvent("restored", t.id); render(); };
      dl.appendChild(li);
    }

    const cutTasks = allTasks().filter(t => cut[t.id]);
    const cd = document.getElementById("cut-drawer");
    cd.style.display = cutTasks.length ? "" : "none";
    document.getElementById("cut-summary").textContent = `Cut with a note (${cutTasks.length}) — click to review or restore`;
    const cl = document.getElementById("cut-list");
    cl.innerHTML = "";
    for (const t of cutTasks) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="t">✂︎ ${t.t}</span><span class="when">${fmtWhen(cut[t.id].ts)}</span><button>restore</button>
        <span class="note">“${cut[t.id].note}”</span>`;
      li.querySelector("button").onclick = () => { delete cut[t.id]; logEvent("restored", t.id); render(); };
      cl.appendChild(li);
    }
  }

  function renderProgress() {
    const total = allTasks().filter(t => !split[t.id]).length;
    const d = allTasks().filter(t => done.has(t.id)).length;
    const c = allTasks().filter(t => cut[t.id]).length;
    const pct = total ? Math.round(((d + c) / total) * 100) : 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("bar-label").textContent =
      `${total - d - c} open · ${d} done · ${c} cut · ${pct}%`;
    document.getElementById("all-clear").style.display = (d + c === total && total > 0) ? "block" : "none";
  }

  function renderLedgerPill() {
    const pill = document.getElementById("ledger-pill");
    const label = document.getElementById("ledger-label");
    pill.classList.remove("ok", "warn");
    if (!FS_OK) {
      if (unsynced > 0) { pill.classList.add("warn"); label.textContent = `Ledger: ${unsynced} unexported change${unsynced === 1 ? "" : "s"} — export`; }
      else { label.textContent = "Ledger: exported"; pill.classList.add("ok"); }
      return;
    }
    if (fsHandle && fsGranted) { pill.classList.add("ok"); label.textContent = "Ledger: auto-saving to file"; }
    else if (fsHandle) { pill.classList.add("warn"); label.textContent = `Ledger: click to reconnect (${unsynced} pending)`; }
    else { pill.classList.add(unsynced > 0 ? "warn" : ""); label.textContent = "Ledger: connect a file"; }
  }

  /* ---------- adder ---------- */
  const addSel = document.getElementById("add-section");
  for (const s of SECTIONS) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.name;
    addSel.appendChild(o);
  }
  const addInput = document.getElementById("add-input");
  function addTask() {
    const v = addInput.value.trim();
    if (!v) return;
    const t = { id: "c-" + Date.now(), s: addSel.value, t: v, chips: [["gray", "added by me"]] };
    custom.push(t);
    logEvent("added", t.id);
    addInput.value = "";
    render();
  }
  document.getElementById("add-btn").onclick = addTask;
  addInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  /* ---------- toolbar wiring ---------- */
  document.getElementById("ledger-pill").onclick = connectLedgerFile;
  document.getElementById("export-btn").onclick = exportReport;
  document.getElementById("import-btn").onclick = () => document.getElementById("import-input").click();
  document.getElementById("import-input").addEventListener("change", e => {
    if (e.target.files[0]) importLedger(e.target.files[0]);
    e.target.value = "";
  });

  render();
  restoreHandle();
}
</script>
</body>
</html>
