<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trail</title>
<style>
  :root {
    --bg: #E6E0D4;
    --card: #F4F0E7;
    --ink: #2A241C;
    --ink-soft: #7E7365;
    --line: #D2C9B8;
    --rule: #A99C87;
    --accent: #53412F;
    --accent-contrast: #F4F0E7;
    --ok: #46607A;
    --warn: #A2703A;
    --danger: #7A2E28;
    --done: #A39885;
    --chip-red: #7A2E28;   --chip-red-bg: #EBDAD5;
    --chip-amber: #7C5426; --chip-amber-bg: #EBDFC9;
    --chip-blue: #3E586F;  --chip-blue-bg: #DBE2E8;
    --chip-gray: #6E6459;  --chip-gray-bg: #E5DFD2;
    --display: "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
    --body-face: "Optima", "Seravek", "Gill Sans", "Segoe UI", sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140F;
      --card: #201C15;
      --ink: #E8E0CF;
      --ink-soft: #998D7B;
      --line: #362F25;
      --rule: #5C5342;
      --accent: #C8A97E;
      --accent-contrast: #1A160F;
      --ok: #8FA6BB;
      --warn: #C99A62;
      --danger: #D28C80;
      --done: #6F6656;
      --chip-red: #D28C80;   --chip-red-bg: #3A241F;
      --chip-amber: #D3AC77; --chip-amber-bg: #362A18;
      --chip-blue: #A5BCCF;  --chip-blue-bg: #1F2A34;
      --chip-gray: #ABA08D;  --chip-gray-bg: #2B261E;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 15.5px/1.55 var(--body-face);
    padding: 52px 20px 120px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { text-align: center; }
  header h1 {
    font-family: var(--display);
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .16em;
  }
  .ledger-rule {
    height: 5px; margin: 14px 0 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .sub { color: var(--ink-soft); font-size: 14px; letter-spacing: .04em; margin-top: 14px; }

  .toolbar {
    margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    border-radius: 2px; padding: 7px 13px;
    font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .pill.ok .dot { background: var(--ok); }
  .pill.warn .dot { background: var(--warn); }
  .pill.static { cursor: default; }
  .pill.static:hover { border-color: var(--line); color: var(--ink-soft); }

  .progress { margin-top: 28px; height: 2px; background: var(--line); }
  .progress > div {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width .6s cubic-bezier(.22,1,.36,1);
  }
  .progress-label {
    font: 400 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); margin-top: 10px;
  }

  .adder { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
  .adder input[type=text] {
    flex: 1 1 220px; background: transparent; color: var(--ink); text-align: left;
    border: none; border-bottom: 1px solid var(--rule); border-radius: 0;
    padding: 9px 2px; font: 14px/1.4 var(--body-face); outline: none;
  }
  .adder input[type=text]::placeholder { color: var(--ink-soft); }
  .adder input[type=text]:focus { border-color: var(--accent); }
  .adder select {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 10px;
    font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    outline: none;
  }
  .adder button {
    background: var(--accent); color: var(--accent-contrast); border: none;
    border-radius: 2px; padding: 9px 20px;
    font: 600 12px var(--body-face); letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
  }

  .section { margin-top: 42px; }
  .section > h2 {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--body-face); font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .24em; color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .section > h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .section > h2 .count { font: 400 11px var(--mono); letter-spacing: 0; }
  .section.empty-hidden { display: none; }

  ul.tasks { list-style: none; }
  li.task {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 13px;
    padding: 15px 18px;
    align-items: start;
    position: relative;
    overflow: hidden;
    max-height: 400px;
    transition: opacity .8s ease, filter .8s ease, transform .8s ease,
                max-height .55s ease .45s, margin-bottom .55s ease .45s,
                padding .55s ease .45s, border-width .55s ease .45s;
  }
  li.task:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

  /* the suit-button checkbox: fasten it to finish */
  .box {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; margin-top: 1px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%; cursor: pointer; position: relative;
    background: transparent; flex-shrink: 0;
    transition: background .2s, border-color .2s;
  }
  .box::before {
    content: ""; position: absolute; left: 6px; top: 6px;
    width: 2.5px; height: 2.5px; border-radius: 50%;
    background: var(--ink-soft);
    box-shadow: 5px 0 0 var(--ink-soft), 0 5px 0 var(--ink-soft), 5px 5px 0 var(--ink-soft);
    transition: opacity .2s;
  }
  .box:hover { border-color: var(--accent); }
  .box:checked { background: var(--accent); border-color: var(--accent); }
  .box:checked::before { opacity: 0; }
  .box:checked::after {
    content: ""; position: absolute; left: 7px; top: 3.5px;
    width: 5px; height: 10px;
    border: solid var(--accent-contrast); border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .task .body { min-width: 0; }
  .task .title {
    font-weight: 600; font-size: 15.5px;
    display: inline;
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 58%;
    transition: background-size .5s ease, color .4s ease;
  }
  .task .detail { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px;
  }
  .chip.red   { color: var(--chip-red);   background: var(--chip-red-bg); }
  .chip.amber { color: var(--chip-amber); background: var(--chip-amber-bg); }
  .chip.blue  { color: var(--chip-blue);  background: var(--chip-blue-bg); }
  .chip.gray  { color: var(--chip-gray);  background: var(--chip-gray-bg); }
  .chip.tag   { color: var(--ink-soft); background: transparent; border: 1px solid var(--line); }

  .cutbtn {
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 2px;
    opacity: 0; transition: opacity .15s ease, color .15s, background .15s;
  }
  li.task:hover .cutbtn { opacity: .7; }
  .cutbtn:hover { opacity: 1 !important; color: var(--danger); background: var(--chip-red-bg); }
  @media (hover: none) { .cutbtn { opacity: .5; } }

  .cutform { grid-column: 1 / -1; margin-top: 4px; }
  .cutform textarea {
    width: 100%; min-height: 64px; resize: vertical;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 10px 12px; font: 13.5px/1.45 var(--body-face); outline: none;
  }
  .cutform textarea:focus { border-color: var(--danger); }
  .cutform .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  .cutform button {
    border-radius: 2px; padding: 7px 14px;
    font: 600 11px var(--body-face); letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer;
  }
  .cutform .confirm { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .cutform .cancel { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .cutform .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  li.task.checked .title { background-size: 100% 1.5px; color: var(--done); }
  li.task.checked .detail, li.task.checked .chip { opacity: .45; }

  /* the stamp: every action goes on the record */
  li.task.checked::after {
    content: "Recorded";
    position: absolute; right: 46px; top: 50%;
    font: 500 10px var(--mono); letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); border: 1px solid currentColor; border-radius: 2px;
    padding: 4px 6px 4px 9px;
    opacity: 0; pointer-events: none;
    transform: translateY(-50%) rotate(-6deg);
    animation: stamp .35s cubic-bezier(.2, 1.2, .4, 1) .2s forwards;
  }
  li.task.melting.cut::after { content: "Cut"; color: var(--danger); }
  @keyframes stamp {
    0%   { opacity: 0;  transform: translateY(-50%) rotate(-6deg) scale(1.7); }
    100% { opacity: .9; transform: translateY(-50%) rotate(-6deg) scale(1); }
  }

  /* paper slides off the desk */
  li.task.melting {
    opacity: 0;
    transform: translate(26px, -6px) rotate(1.5deg);
    transform-origin: center;
    max-height: 0; margin-bottom: 0;
    padding-top: 0; padding-bottom: 0;
    border-width: 0; pointer-events: none;
  }
  li.task.melting.cut { filter: grayscale(1); transform: translate(26px, 8px) rotate(-2deg); }

  .drawer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 16px; }
  .drawer summary {
    cursor: pointer; color: var(--ink-soft);
    font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase;
    list-style: none; user-select: none;
  }
  .drawer summary::-webkit-details-marker { display: none; }
  .drawer summary::before { content: "▸ "; }
  .drawer[open] summary::before { content: "▾ "; }
  ul.log-list { list-style: none; margin-top: 12px; }
  ul.log-list li {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 7px 4px; color: var(--done); font-size: 14px;
  }
  ul.log-list li .t { text-decoration: line-through; }
  ul.log-list li .note { font-style: italic; font-size: 13px; flex-basis: 100%; padding-left: 18px; }
  ul.log-list li .when { font: 400 10.5px var(--mono); letter-spacing: .06em; }
  ul.log-list button {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 2px; padding: 3px 10px;
    font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer;
  }
  ul.log-list button:hover { color: var(--accent); border-color: var(--accent); }

  .all-clear { display: none; text-align: center; margin-top: 64px; color: var(--ink-soft); }
  .all-clear .rule-double {
    height: 5px; margin-bottom: 26px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .all-clear .big {
    font-family: var(--display); font-size: 26px; color: var(--ink);
    text-transform: uppercase; letter-spacing: .18em;
  }
  .all-clear p { margin-top: 10px; font-size: 14.5px; }

  .footer-note {
    margin-top: 56px; text-align: center;
    font: 400 10px var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition-duration: .01ms !important; transition-delay: 0ms !important;
      animation-duration: .01ms !important; animation-delay: 0ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="app-title">Paper Trail</h1>
    <div class="ledger-rule"></div>
    <div class="sub" id="app-subtitle"></div>
    <div class="toolbar">
      <button class="pill" id="ledger-pill" title="Ledger file sync"><span class="dot"></span><span id="ledger-label">Ledger: not connected</span></button>
      <button class="pill" id="export-btn">Export ledger</button>
      <button class="pill" id="import-btn">Import ledger</button>
      <input type="file" id="import-input" accept="application/json" hidden>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-label" id="bar-label"></div>
    <div class="adder">
      <input type="text" id="add-input" placeholder="Add to the record…">
      <select id="add-section"></select>
      <button id="add-btn">Add</button>
    </div>
  </header>

  <div id="sections"></div>

  <div class="all-clear" id="all-clear">
    <div class="rule-double"></div>
    <div class="big">Nothing outstanding</div>
    <p>Every item is on the record.</p>
  </div>

  <details class="drawer" id="done-drawer" style="display:none">
    <summary id="done-summary"></summary>
    <ul class="log-list" id="done-list"></ul>
  </details>

  <details class="drawer" id="cut-drawer" style="display:none">
    <summary id="cut-summary"></summary>
    <ul class="log-list" id="cut-list"></ul>
  </details>

  <div class="footer-note">paper trail · every check-off and cut is timestamped in the ledger</div>
</div>

<script>
/* ---------- data loading: data/tasks.js (private) with sample fallback ---------- */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

(async function boot() {
  try { await loadScript("data/tasks.js"); }
  catch { await loadScript("sample-data/tasks.sample.js"); }
  if (!window.PAPERTRAIL) {
    document.getElementById("app-subtitle").textContent =
      "No task data found. Copy sample-data/tasks.sample.js to data/tasks.js and edit it.";
    return;
  }
  init(window.PAPERTRAIL);
})();

function init(DATA) {
  const NS = "papertrail::" + (DATA.storageKey || "default") + "::";
  const OLD_NS = "meltaway::" + (DATA.storageKey || "default") + "::";  // pre-rename state
  const SECTIONS = DATA.sections;
  const DEFAULT_TASKS = DATA.tasks;

  document.title = DATA.title || "Paper Trail";
  document.getElementById("app-title").textContent = DATA.title || "Paper Trail";
  document.getElementById("app-subtitle").textContent = DATA.subtitle || "";

  /* ---------- persistence ---------- */
  const load = (k, fb) => { try { return JSON.parse(localStorage.getItem(NS + k) ?? localStorage.getItem(OLD_NS + k)) ?? fb; } catch { return fb; } };
  const save = (k, v) => localStorage.setItem(NS + k, JSON.stringify(v));

  let done = new Set(load("done", []));
  let cut = load("cut", {});            // id -> {note, ts}
  let custom = load("custom", []);
  let ledger = load("ledger", []);      // append-only event log
  let unsynced = load("unsynced", 0);

  /* one-time migration from the pre-repo Desktop version */
  if (DATA.migrateFrom && done.size === 0 && ledger.length === 0) {
    try {
      const oldDone = JSON.parse(localStorage.getItem(DATA.migrateFrom.done) || "[]");
      const oldCustom = JSON.parse(localStorage.getItem(DATA.migrateFrom.custom) || "[]");
      if (oldDone.length || oldCustom.length) {
        done = new Set(oldDone);
        custom = oldCustom.map(t => ({ id: t.id, s: t.s, t: t.t, d: t.d, chips: t.chips }));
        for (const t of custom) ledger.push({ ts: null, type: "added", id: t.id, title: t.t, section: t.s, note: "migrated from v1" });
        for (const id of oldDone) {
          const t = DEFAULT_TASKS.concat(custom).find(x => x.id === id);
          ledger.push({ ts: null, type: "done", id, title: t ? t.t : id, section: t ? t.s : null, note: "migrated from v1 (timestamp unknown)" });
        }
        persist();
      }
    } catch {}
  }

  function persist() {
    save("done", [...done]); save("cut", cut); save("custom", custom);
    save("ledger", ledger); save("unsynced", unsynced);
  }

  const allTasks = () => DEFAULT_TASKS.concat(custom);
  const findTask = id => allTasks().find(t => t.id === id);
  const secName = id => (SECTIONS.find(s => s.id === id) || {}).name || id;

  /* ---------- ledger events ---------- */
  function logEvent(type, id, note) {
    const t = findTask(id) || {};
    ledger.push({
      ts: new Date().toISOString(),
      type, id,
      title: t.t || id,
      section: t.s || null,
      sectionName: t.s ? secName(t.s) : null,
      re: t.re || null,
      note: note || null,
    });
    unsynced++;
    persist();
    syncFile();
    renderLedgerPill();
  }

  function ledgerObj() {
    return {
      app: "papertrail",
      version: 1,
      title: DATA.title || "Paper Trail",
      exportedAt: new Date().toISOString(),
      state: {
        open: allTasks().filter(t => !done.has(t.id) && !cut[t.id]).map(t => ({ id: t.id, title: t.t, section: secName(t.s), re: t.re || null })),
        done: [...done].map(id => { const t = findTask(id) || {}; return { id, title: t.t || id, re: t.re || null }; }),
        cut: Object.entries(cut).map(([id, v]) => { const t = findTask(id) || {}; return { id, title: t.t || id, re: t.re || null, note: v.note, ts: v.ts }; }),
      },
      events: ledger,
    };
  }

  /* ---------- ledger file sync (File System Access API, Chrome/Edge) ---------- */
  const FS_OK = "showSaveFilePicker" in window;
  let fsHandle = null;
  let fsGranted = false;

  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("papertrail-fs", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("handles");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("handles").objectStore("handles").get(key);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("handles", "readwrite").objectStore("handles").put(val, key);
        q.onsuccess = () => res(); q.onerror = () => rej(q.error);
      });
    },
  };

  async function syncFile() {
    if (!fsHandle || !fsGranted) return;
    try {
      const w = await fsHandle.createWritable();
      await w.write(JSON.stringify(ledgerObj(), null, 2));
      await w.close();
      unsynced = 0; persist(); renderLedgerPill();
    } catch { fsGranted = false; renderLedgerPill(); }
  }

  async function connectLedgerFile() {
    if (!FS_OK) { exportLedger(); return; }
    try {
      if (fsHandle && !fsGranted) {
        const p = await fsHandle.requestPermission({ mode: "readwrite" });
        if (p === "granted") { fsGranted = true; await syncFile(); return; }
      }
      fsHandle = await window.showSaveFilePicker({
        suggestedName: "ledger.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      await idb.set("ledger", fsHandle);
      fsGranted = true;
      await syncFile();
    } catch { /* user cancelled */ }
    renderLedgerPill();
  }

  async function restoreHandle() {
    if (!FS_OK) return;
    try {
      const h = await idb.get("ledger");
      if (!h) return;
      fsHandle = h;
      const p = await h.queryPermission({ mode: "readwrite" });
      fsGranted = (p === "granted");
      if (fsGranted && unsynced > 0) await syncFile();
    } catch {}
    renderLedgerPill();
  }

  function exportLedger() {
    const blob = new Blob([JSON.stringify(ledgerObj(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ledger.json";
    a.click();
    URL.revokeObjectURL(a.href);
    unsynced = 0; persist(); renderLedgerPill();
  }

  function importLedger(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.events)) throw new Error("no events");
        if (!confirm("Import replaces the current board state with the ledger's history. Continue?")) return;
        done = new Set(); cut = {}; custom = []; ledger = data.events;
        for (const e of ledger) {
          if (e.type === "added" && !DEFAULT_TASKS.some(t => t.id === e.id) && !custom.some(t => t.id === e.id)) {
            custom.push({ id: e.id, s: e.section || SECTIONS[0].id, t: e.title, chips: [["gray", "added by me"]] });
          }
          if (e.type === "done") { done.add(e.id); delete cut[e.id]; }
          if (e.type === "cut") { cut[e.id] = { note: e.note, ts: e.ts }; done.delete(e.id); }
          if (e.type === "restored") { done.delete(e.id); delete cut[e.id]; }
        }
        unsynced = 0; persist(); render();
      } catch { alert("That file doesn't look like a Paper Trail ledger."); }
    };
    r.readAsText(file);
  }

  /* ---------- rendering ---------- */
  const $sections = document.getElementById("sections");

  function chipsHtml(t) {
    const chips = (t.chips || []).map(([c, txt]) => `<span class="chip ${c}">${txt}</span>`);
    if (t.re) chips.push(`<span class="chip tag">${t.re}</span>`);
    return chips.length ? `<div class="chips">${chips.join("")}</div>` : "";
  }

  function taskEl(t) {
    const li = document.createElement("li");
    li.className = "task";
    li.dataset.id = t.id;
    li.innerHTML = `
      <input type="checkbox" class="box" aria-label="complete task">
      <div class="body">
        <span class="title">${t.t}</span>
        ${t.d ? `<div class="detail">${t.d}</div>` : ""}
        ${chipsHtml(t)}
      </div>
      <button class="cutbtn" title="Remove from list (with a note)">✕</button>`;

    li.querySelector(".box").addEventListener("change", (e) => {
      if (!e.target.checked) return;
      li.classList.add("checked");
      setTimeout(() => li.classList.add("melting"), 650);
      setTimeout(() => { done.add(t.id); logEvent("done", t.id); render(); }, 1750);
    });

    li.querySelector(".cutbtn").addEventListener("click", () => {
      if (li.querySelector(".cutform")) return;
      const form = document.createElement("div");
      form.className = "cutform";
      form.innerHTML = `
        <textarea placeholder="Note for the record — why is this coming off the list? (e.g. traded against X, no longer relevant, handed off)"></textarea>
        <div class="hint">This goes in the ledger — and your end-of-project summary — as a conscious cut, not a miss.</div>
        <div class="row">
          <button class="cancel">Cancel</button>
          <button class="confirm">Remove from list</button>
        </div>`;
      li.appendChild(form);
      const ta = form.querySelector("textarea");
      ta.focus();
      form.querySelector(".cancel").onclick = () => form.remove();
      form.querySelector(".confirm").onclick = () => {
        const note = ta.value.trim();
        if (!note) { ta.placeholder = "A note is required — future-you will want the why."; ta.focus(); return; }
        li.classList.add("checked");
        setTimeout(() => li.classList.add("melting", "cut"), 250);
        setTimeout(() => {
          cut[t.id] = { note, ts: new Date().toISOString() };
          logEvent("cut", t.id, note);
          render();
        }, 1350);
      };
    });
    return li;
  }

  function render() {
    $sections.innerHTML = "";
    for (const sec of SECTIONS) {
      const items = allTasks().filter(t => t.s === sec.id && !done.has(t.id) && !cut[t.id]);
      const el = document.createElement("div");
      el.className = "section";
      el.innerHTML = `<h2>${sec.name} <span class="count">· ${items.length}</span></h2>`;
      const ul = document.createElement("ul");
      ul.className = "tasks";
      for (const t of items) ul.appendChild(taskEl(t));
      el.appendChild(ul);
      if (items.length === 0) el.classList.add("empty-hidden");
      $sections.appendChild(el);
    }
    renderDrawers();
    renderProgress();
    renderLedgerPill();
  }

  function fmtWhen(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function renderDrawers() {
    const doneTasks = allTasks().filter(t => done.has(t.id));
    const dd = document.getElementById("done-drawer");
    dd.style.display = doneTasks.length ? "" : "none";
    document.getElementById("done-summary").textContent = `Done (${doneTasks.length}) — click to review or restore`;
    const dl = document.getElementById("done-list");
    dl.innerHTML = "";
    for (const t of doneTasks) {
      const ev = [...ledger].reverse().find(e => e.id === t.id && e.type === "done");
      const li = document.createElement("li");
      li.innerHTML = `<span class="t">✓ ${t.t}</span><span class="when">${ev ? fmtWhen(ev.ts) : ""}</span><button>restore</button>`;
      li.querySelector("button").onclick = () => { done.delete(t.id); logEvent("restored", t.id); render(); };
      dl.appendChild(li);
    }

    const cutTasks = allTasks().filter(t => cut[t.id]);
    const cd = document.getElementById("cut-drawer");
    cd.style.display = cutTasks.length ? "" : "none";
    document.getElementById("cut-summary").textContent = `Cut with a note (${cutTasks.length}) — click to review or restore`;
    const cl = document.getElementById("cut-list");
    cl.innerHTML = "";
    for (const t of cutTasks) {
      const li = document.createElement("li");
      li.innerHTML = `<span class="t">✂︎ ${t.t}</span><span class="when">${fmtWhen(cut[t.id].ts)}</span><button>restore</button>
        <span class="note">“${cut[t.id].note}”</span>`;
      li.querySelector("button").onclick = () => { delete cut[t.id]; logEvent("restored", t.id); render(); };
      cl.appendChild(li);
    }
  }

  function renderProgress() {
    const total = allTasks().length;
    const d = allTasks().filter(t => done.has(t.id)).length;
    const c = allTasks().filter(t => cut[t.id]).length;
    const pct = total ? Math.round(((d + c) / total) * 100) : 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("bar-label").textContent =
      `${total - d - c} open · ${d} done · ${c} cut · ${pct}%`;
    document.getElementById("all-clear").style.display = (d + c === total && total > 0) ? "block" : "none";
  }

  function renderLedgerPill() {
    const pill = document.getElementById("ledger-pill");
    const label = document.getElementById("ledger-label");
    pill.classList.remove("ok", "warn");
    if (!FS_OK) {
      if (unsynced > 0) { pill.classList.add("warn"); label.textContent = `Ledger: ${unsynced} unexported change${unsynced === 1 ? "" : "s"} — export`; }
      else { label.textContent = "Ledger: exported"; pill.classList.add("ok"); }
      return;
    }
    if (fsHandle && fsGranted) { pill.classList.add("ok"); label.textContent = "Ledger: auto-saving to file"; }
    else if (fsHandle) { pill.classList.add("warn"); label.textContent = `Ledger: click to reconnect (${unsynced} pending)`; }
    else { pill.classList.add(unsynced > 0 ? "warn" : ""); label.textContent = "Ledger: connect a file"; }
  }

  /* ---------- adder ---------- */
  const addSel = document.getElementById("add-section");
  for (const s of SECTIONS) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.name;
    addSel.appendChild(o);
  }
  const addInput = document.getElementById("add-input");
  function addTask() {
    const v = addInput.value.trim();
    if (!v) return;
    const t = { id: "c-" + Date.now(), s: addSel.value, t: v, chips: [["gray", "added by me"]] };
    custom.push(t);
    logEvent("added", t.id);
    addInput.value = "";
    render();
  }
  document.getElementById("add-btn").onclick = addTask;
  addInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  /* ---------- toolbar wiring ---------- */
  document.getElementById("ledger-pill").onclick = connectLedgerFile;
  document.getElementById("export-btn").onclick = exportLedger;
  document.getElementById("import-btn").onclick = () => document.getElementById("import-input").click();
  document.getElementById("import-input").addEventListener("change", e => {
    if (e.target.files[0]) importLedger(e.target.files[0]);
    e.target.value = "";
  });

  render();
  restoreHandle();
}
</script>
</body>
</html>
